name: Reflex Frontier Diagnose

on:
  push:
    branches:
      - main
    paths:
      - "tools/frontier_context.py"
      - ".github/workflows/frontier-diagnose.yml"

permissions:
  contents: read

env:
  KIT_REV: eb32cc42623e0e9e868b9d27423a57d5a5cba56b
  GHIDRA_VERSION: "12.1.3"
  REFLEX_SHA256: 917d14e7ef7ce492b665fea7d0c87c9a39b549e2a43b09883d2a786988e7c02c
  INPUT_REPO: NyerahMT/ReflexBuildInput
  BASELINE_TAG: game-input-v1
  TRANSLATE_POLICY_REV: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: Compute private baseline key
        shell: bash
        run: |
          set -euo pipefail
          config_sha="$(cat tools/analyze.py game.toml | sha256sum | awk '{print $1}')"
          asset="Reflex-Baseline-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "BASELINE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Download private listing baseline
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reflex-baseline"
          gh release download "$BASELINE_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$BASELINE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-baseline" \
            --clobber
          tar -xzf "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET" -C "$GITHUB_WORKSPACE"
          test -f analysis/decompiled/MXReflex.exe/functions.tsv

      - name: Map UI lookup callers and runtime frontier
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          python3 tools/frontier_context.py \
            --quick \
            analysis/decompiled/MXReflex.exe \
            0078fd40 0078fd60 0078fd70 0078fd72 0078fd80 0078fda0 0078fdc0 \
            0078fde0 0078fe00 0078fe20 0078fe40 0078fe60 0078fe80 0078fea0 \
            0078fec0 0078fee0 0078ff00 0078ff20 0078ff40 \
            008042b7 008042db 00804303 00805d03 \
            00803ed0 00804340 00804414 0080446f 00804492 008044cc \
            0080450f 0080452e 00804565 008045a0 \
            00806017 00806028 00806047 008060ae 00806104 \
            007b1100 007b1131 007b1145 007b1150 007b1180 \
             007b6cf0 007b6d20 007b6d40 007b6d4f 007b6d60 007b6d80 007b6e00 007b7260 \
             007b3480 007b34a0 007b34c9 007b34d4 007b34e0 007b3500 \
            00784e70 00784ea0 00784eb0 00784ed0 00784eec 00784f00 00784f20 \
            005c9900 005c9940 005c9970 005c9990 005c9996 005c99a0 005c99c0 \
            005edb70 005edb9c 00787518 \
            008814a0 00881690 00881740 00881759 00881770 00881800 00881880 00881900 \
            0084a2d0 0084a339 0084a448 0084a456 0084a459 0084a4e0 0084baf0 0084bb12 0084bc20 0084bc35 \
            0084a7f0 0084a7ff 0084a81b 0084a835 0084a83a 0084a840 0084a851 0084a85f 0084a870 0084a880 \
            0084a820 0084a890 0084a8ac 0084a8c4 0084a8f0 0084a910 0084a950 \
            0084dcd0 0084dd40 0084de30 0084dea0 0084dec0 0084df20 \
            0084a1f0 0084a930 0084a9d8 0084aa10 0084db00 0084db40 0084dc20 \
            007fa250 007fa280 0084a970 0084a9a0 \
            0042bf00 0042bfb0 0042bfe1 0042c140 0042c16d \
            00806110 00806175 00806f90 00806fc2 0084b065 \
            | tee build/logs/frontier-context.txt

      - name: Upload frontier context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-frontier-context-${{ github.run_number }}
          path: build/logs/frontier-context.txt
          if-no-files-found: warn
          retention-days: 14
