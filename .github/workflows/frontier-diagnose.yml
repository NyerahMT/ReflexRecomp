name: Reflex Frontier Diagnose

on:
  push:
    branches:
      - main
    paths:
      - "tools/frontier_context.py"
      - ".github/workflows/frontier-diagnose.yml"

permissions:
  contents: read

env:
  KIT_REV: eb32cc42623e0e9e868b9d27423a57d5a5cba56b
  GHIDRA_VERSION: "12.1.3"
  REFLEX_SHA256: 917d14e7ef7ce492b665fea7d0c87c9a39b549e2a43b09883d2a786988e7c02c
  INPUT_REPO: NyerahMT/ReflexBuildInput
  BASELINE_TAG: game-input-v1
  TRANSLATE_POLICY_REV: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: Compute private baseline key
        shell: bash
        run: |
          set -euo pipefail
          config_sha="$(cat tools/analyze.py game.toml | sha256sum | awk '{print $1}')"
          asset="Reflex-Baseline-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "BASELINE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Download private listing baseline
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reflex-baseline"
          gh release download "$BASELINE_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$BASELINE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-baseline" \
            --clobber
          tar -xzf "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET" -C "$GITHUB_WORKSPACE"
          test -f analysis/decompiled/MXReflex.exe/functions.tsv

      - name: Map current runtime frontier
        shell: bash
        run: |
          python3 tools/frontier_context.py \
            --quick \
            analysis/decompiled/MXReflex.exe \
            00806110 00806140 00806160 00806170 00806184 008061a0 008061c0 \
            008061e0 00806200 00806220 00806240 00806260 00806280 008062a0 \
            008062c0 008062e0 00806300 00806320 00806340 00806360 00806380 \
            008063a0 008063c0 008063e0 00806400 00806420 00806440 00806460 \
            00806480 008064a0 008064c0 008064cb
