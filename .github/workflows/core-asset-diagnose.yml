name: Reflex Core Asset Diagnose

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/core-asset-diagnose.yml"

permissions:
  contents: read

env:
  INPUT_REPO: NyerahMT/ReflexBuildInput
  INPUT_TAG: game-input-v1
  CORE_ASSET: Game-Core.zip

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: List private input release assets
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          echo "Assets on $INPUT_REPO release $INPUT_TAG:"
          gh release view "$INPUT_TAG" --repo "$INPUT_REPO" --json assets --jq '.assets[].name'

      - name: Download private Reflex core
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reflex-assets"
          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$CORE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber

      - name: Inspect core database payload
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/reflex-assets/$CORE_ASSET"
          echo "Exact/CI-insensitive target matches:"
          unzip -Z1 "$archive" | grep -i -E '(^|/)Database/EngineDependencies\.dx9\.database$' || true
          echo
          echo "EngineDependencies-like entries:"
          unzip -Z1 "$archive" | grep -i 'EngineDependencies' | head -n 100 || true
          echo
          echo "Database directory sample:"
          unzip -Z1 "$archive" | grep -i -E '(^|/)Database/' | head -n 100 || true

      - name: Locate database in private archive chunks
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          for asset in Archive.zip Archive.2.zip Archive.3.zip Archive.4.zip; do
            echo "=== $asset ==="
            rm -f "$RUNNER_TEMP/reflex-assets"/Archive*.zip
            gh release download "$INPUT_TAG" \
              --repo "$INPUT_REPO" \
              --pattern "$asset" \
              --dir "$RUNNER_TEMP/reflex-assets" \
              --clobber
            archive="$RUNNER_TEMP/reflex-assets/$asset"
            list="$RUNNER_TEMP/reflex-assets/$asset.list"
            unzip -Z1 "$archive" > "$list"
            matches="$(grep -i -E '(^|/)Database/EngineDependencies\.dx9\.database$' "$list" || true)"
            if [[ -n "$matches" ]]; then
              echo "FOUND EngineDependencies in $asset:"
              printf '%s\n' "$matches"
            else
              echo "No exact EngineDependencies target in $asset"
            fi
            echo "MXUI package candidates in $asset:"
            grep -i -E '(^|/)[^/]*MXUI[^/]*\.package$' "$list" | head -n 80 || true
            echo "All UI/menu package candidates:"
            grep -i -E '(^|/)[^/]*(ui|menu)[^/]*\.package$' "$list" | head -n 80 || true
            echo "All .database entries:"
            grep -i -E '\.database$' "$list" | head -n 200 || true
            echo "Dependency-like entries:"
            grep -i -E 'dependenc|engine.*db|db.*engine|database' "$list" | head -n 250 || true
            echo "Likely nested/packed containers:"
            grep -i -E '\.(zip|7z|rar|pak|pack|arc|bin|dat|vpp|vpp_pc|bff|bundle|cab)$' "$list" | head -n 250 || true
            echo "Most common file extensions:"
            awk -F/ '{print $NF}' "$list" | awk -F. 'NF>1 {print tolower($NF)}' | sort | uniq -c | sort -nr | head -n 40 || true
            rm -f "$list" "$archive"
          done

      - name: Inspect EngineDependencies package structure
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/reflex-assets/Archive.4.zip"
          list="$RUNNER_TEMP/reflex-assets/Archive.4.list"
          pkg="$RUNNER_TEMP/reflex-assets/EngineDependencies.dx9.package"
          rm -f "$archive" "$list" "$pkg"

          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "Archive.4.zip" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber

          unzip -Z1 "$archive" > "$list"
          pkg_entry="$(grep -i -F 'EngineDependencies.dx9.package' "$list" | grep -vi '__MACOSX/' | sed -n '1p' || true)"
          if [[ -z "$pkg_entry" ]]; then
            echo "::error::EngineDependencies.dx9.package not found in Archive.4.zip"
            exit 1
          fi

          echo "Package entry: $pkg_entry"
          unzip -p "$archive" "$pkg_entry" > "$pkg"
          stat -c 'size=%s bytes' "$pkg"
          file "$pkg" || true

          echo "First 256 bytes:"
          xxd -g1 -l 256 "$pkg" || true

          echo "Candidate embedded names/paths:"
          strings -a -n 4 "$pkg" \
            | grep -i -E 'engine|dependenc|database|package|shader|renderer|\\.dx9|\\.(dll|xml|txt|ini|lua)$' \
            | head -n 400 || true

          echo "Archive-format probes:"
          7z l "$pkg" || true
          unzip -l "$pkg" || true
          tar -tf "$pkg" || true
 "$list" | head -n 80 || true
            echo "All .package entries matching UI or menu:"
            grep -i -E '(^|/)[^/]*(ui|menu)[^/]*\\.package
            grep -i -E '\.database$' "$list" | head -n 200 || true
            echo "Dependency-like entries:"
            grep -i -E 'dependenc|engine.*db|db.*engine|database' "$list" | head -n 250 || true
            echo "Likely nested/packed containers:"
            grep -i -E '\.(zip|7z|rar|pak|pack|arc|bin|dat|vpp|vpp_pc|bff|bundle|cab)$' "$list" | head -n 250 || true
            echo "Most common file extensions:"
            awk -F/ '{print $NF}' "$list" | awk -F. 'NF>1 {print tolower($NF)}' | sort | uniq -c | sort -nr | head -n 40 || true
            rm -f "$list" "$archive"
          done

      - name: Inspect EngineDependencies package structure
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/reflex-assets/Archive.4.zip"
          list="$RUNNER_TEMP/reflex-assets/Archive.4.list"
          pkg="$RUNNER_TEMP/reflex-assets/EngineDependencies.dx9.package"
          rm -f "$archive" "$list" "$pkg"

          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "Archive.4.zip" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber

          unzip -Z1 "$archive" > "$list"
          pkg_entry="$(grep -i -F 'EngineDependencies.dx9.package' "$list" | grep -vi '__MACOSX/' | sed -n '1p' || true)"
          if [[ -z "$pkg_entry" ]]; then
            echo "::error::EngineDependencies.dx9.package not found in Archive.4.zip"
            exit 1
          fi

          echo "Package entry: $pkg_entry"
          unzip -p "$archive" "$pkg_entry" > "$pkg"
          stat -c 'size=%s bytes' "$pkg"
          file "$pkg" || true

          echo "First 256 bytes:"
          xxd -g1 -l 256 "$pkg" || true

          echo "Candidate embedded names/paths:"
          strings -a -n 4 "$pkg" \
            | grep -i -E 'engine|dependenc|database|package|shader|renderer|\\.dx9|\\.(dll|xml|txt|ini|lua)$' \
            | head -n 400 || true

          echo "Archive-format probes:"
          7z l "$pkg" || true
          unzip -l "$pkg" || true
          tar -tf "$pkg" || true
 "$list" | head -n 80 || true
            echo "All .database entries:"
            grep -i -E '\.database$' "$list" | head -n 200 || true
            echo "Dependency-like entries:"
            grep -i -E 'dependenc|engine.*db|db.*engine|database' "$list" | head -n 250 || true
            echo "Likely nested/packed containers:"
            grep -i -E '\.(zip|7z|rar|pak|pack|arc|bin|dat|vpp|vpp_pc|bff|bundle|cab)$' "$list" | head -n 250 || true
            echo "Most common file extensions:"
            awk -F/ '{print $NF}' "$list" | awk -F. 'NF>1 {print tolower($NF)}' | sort | uniq -c | sort -nr | head -n 40 || true
            rm -f "$list" "$archive"
          done

      - name: Inspect EngineDependencies package structure
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/reflex-assets/Archive.4.zip"
          list="$RUNNER_TEMP/reflex-assets/Archive.4.list"
          pkg="$RUNNER_TEMP/reflex-assets/EngineDependencies.dx9.package"
          rm -f "$archive" "$list" "$pkg"

          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "Archive.4.zip" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber

          unzip -Z1 "$archive" > "$list"
          pkg_entry="$(grep -i -F 'EngineDependencies.dx9.package' "$list" | grep -vi '__MACOSX/' | sed -n '1p' || true)"
          if [[ -z "$pkg_entry" ]]; then
            echo "::error::EngineDependencies.dx9.package not found in Archive.4.zip"
            exit 1
          fi

          echo "Package entry: $pkg_entry"
          unzip -p "$archive" "$pkg_entry" > "$pkg"
          stat -c 'size=%s bytes' "$pkg"
          file "$pkg" || true

          echo "First 256 bytes:"
          xxd -g1 -l 256 "$pkg" || true

          echo "Candidate embedded names/paths:"
          strings -a -n 4 "$pkg" \
            | grep -i -E 'engine|dependenc|database|package|shader|renderer|\\.dx9|\\.(dll|xml|txt|ini|lua)$' \
            | head -n 400 || true

          echo "Archive-format probes:"
          7z l "$pkg" || true
          unzip -l "$pkg" || true
          tar -tf "$pkg" || true
