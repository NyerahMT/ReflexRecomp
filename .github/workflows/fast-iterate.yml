name: Fast Reflex Iteration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "tools/patch_reflex_runtime.py"
      - "tools/patch_reflex_sse.py"
      - "tools/patch_reflex_interp.py"
      - "tools/refresh_cached_function.py"
      - "tools/patch_reflex_seh.py"
      - ".github/workflows/fast-iterate.yml"

permissions:
  contents: read

concurrency:
  group: fast-reflex-${{ github.ref }}
  cancel-in-progress: true

env:
  KIT_REV: eb32cc42623e0e9e868b9d27423a57d5a5cba56b
  GHIDRA_VERSION: "12.1.3"
  REFLEX_SHA256: 917d14e7ef7ce492b665fea7d0c87c9a39b549e2a43b09883d2a786988e7c02c
  INPUT_REPO: NyerahMT/ReflexBuildInput
  INPUT_TAG: game-input-v1
  CORE_ASSET: Game-Core.zip
  BASELINE_TAG: game-input-v1
  TRANSLATE_POLICY_REV: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: Checkout pinned recomp-kit
        uses: actions/checkout@v7.0.1
        with:
          repository: veritr1x/recomp-kit
          ref: ${{ env.KIT_REV }}
          path: kit

      - name: Patch Reflex runtime compatibility
        run: |
          python3 tools/patch_reflex_seh.py
          python3 tools/patch_reflex_runtime.py
          python3 tools/patch_reflex_sse.py
          python3 tools/patch_reflex_interp.py

      - name: Compute private baseline key
        run: |
          set -euo pipefail
          config_sha="$(cat tools/analyze.py game.toml | sha256sum | awk '{print $1}')"
          asset="Reflex-Baseline-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "BASELINE_ASSET=$asset" >> "$GITHUB_ENV"
          echo "Looking for private baseline: $asset"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install fast-path build and runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld build-essential pkg-config unzip ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            xvfb xauth libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt

      - name: Download private Reflex core and recomp baseline
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing Actions secret REFLEX_INPUT_TOKEN"
            exit 1
          fi
          mkdir -p \
            "$RUNNER_TEMP/reflex-assets" \
            "$RUNNER_TEMP/reflex-game" \
            "$RUNNER_TEMP/reflex-baseline"

          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$CORE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber
          test -s "$RUNNER_TEMP/reflex-assets/$CORE_ASSET"
          unzip -q "$RUNNER_TEMP/reflex-assets/$CORE_ASSET" -d "$RUNNER_TEMP/reflex-game"

          if ! gh release download "$BASELINE_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$BASELINE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-baseline" \
            --clobber; then
            echo "::error::No matching private recomp baseline exists. Run 'Analyze + Translate Reflex' once on this revision/toolchain to create it."
            exit 1
          fi
          test -s "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET"
          tar -xzf "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET" -C "$GITHUB_WORKSPACE"
          test -f analysis/decompiled/MXReflex.exe/functions.tsv
          test -f build/recomp/gen/table.c
          test -f build/recomp/gen/symbols.json
          cp build/recomp/gen/symbols.json build/recomp/symbols.json
          test -f build/recomp/symbols.json
          test -d "$CCACHE_DIR"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Locate and verify private executable
        run: |
          set -euo pipefail
          exe="$(find "$RUNNER_TEMP/reflex-game" -type f -iname 'MXReflex.exe' -print -quit)"
          if [[ -z "$exe" ]]; then
            echo "MXReflex.exe was not found after extracting $CORE_ASSET"
            exit 1
          fi
          echo "$REFLEX_SHA256  $exe" | sha256sum -c -
          game_root="$(dirname "$exe")"
          echo "REFLEX_GAME_ROOT=$game_root" >> "$GITHUB_ENV"

      - name: Link private game input
        run: .venv/bin/python tools/setup.py --install "$REFLEX_GAME_ROOT" --link-only

      - name: Resolve current null-call frontier
        run: |
          set -euo pipefail
          asm_root="analysis/decompiled/MXReflex.exe/functions"
          hit="$(grep -l -i -m1 '^008244e8  ' "$asm_root"/*.asm | head -n 1 || true)"
          if [[ -z "$hit" ]]; then
            echo "::error::Could not map runtime return address 0x008244E8 into the private Reflex listing"
            exit 1
          fi
          frontier_fn="$(basename "$hit" .asm)"
          echo "REFLEX_FRONTIER_FN=$frontier_fn" >> "$GITHUB_ENV"
          echo "Mapped runtime return 0x008244E8 to private function $frontier_fn"

      - name: Refresh reached SSE functions from private listing
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/reflex-fn-refresh"
          rm -rf "$fresh"
          mkdir -p "$fresh"

          .venv/bin/python kit/tools/recomp/translate.py \
            --game "$GITHUB_WORKSPACE" \
            --out "$fresh" \
            --only 00903a60 00904300 0090da70 0090dac0 0090dcf0 0090ddf0 "$REFLEX_FRONTIER_FN" \
            --allow-table-gaps "Targeted fast refresh uses the established Reflex recovery policy" \
            --allow-unmodelled "Targeted fast refresh keeps the established Reflex unresolved-path policy"

          for addr in 00903a60 00904300 0090da70 0090dac0 0090dcf0 0090ddf0 "$REFLEX_FRONTIER_FN"; do
            python3 tools/refresh_cached_function.py \
              --cached build/recomp/gen \
              --fresh "$fresh" \
              --address "$addr"
          done

          if grep -Rqs -E 'recomp_unmodelled\(c, 0x(00903a7c|0090431c|0090daa3|0090daf3|0090dd27|0090de25)u\)' build/recomp/gen; then
            echo "::error::Reflex SSE refresh still contains a reached/adjacent UNPCKLPS trap"
            exit 1
          fi
          echo "Refreshed private cached translations for all currently reached/adjacent packed-single SSE initializers."

      - name: Instrument current Registry caller frontier
        run: python3 tools/patch_reflex_call_trace.py

      - name: Build from cached translation
        id: host
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/logs
          .venv/bin/python tools/build.py --target app \
            2>&1 | tee build/logs/host-build.log
          test -x build/package/ReflexRecomp/ReflexRecomp
          ldd build/package/ReflexRecomp/ReflexRecomp | tee build/logs/host-ldd.txt
          ccache --show-stats | tee build/logs/ccache-after-build.txt

      - name: Probe Reflex runtime gate
        id: boot
        if: steps.host.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 30s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=2 \
                RECOMP_WATCH_FRAME=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            2>&1 | tee build/logs/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > build/logs/runtime-exit-code.txt
          echo "Runtime probe exit code: $rc"

          if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then
            if grep -Eq 'unknown stdcall argument count|SEH: unhandled|call to unknown target|call to 00000000' build/logs/runtime.log; then
              echo "FAIL: Reflex stayed alive, but the runtime is stuck behind unresolved ABI/control-flow faults."
              grep -E 'unknown stdcall argument count|SEH: unhandled|call to unknown target|call to 00000000' \
                build/logs/runtime.log | tail -n 80 || true
              exit 1
            fi
            echo "PASS: Reflex stayed alive for the full 30-second runtime gate without unresolved ABI/control-flow faults."
            exit 0
          fi

          echo "FAIL: Reflex exited before the runtime gate completed."
          grep -E '\[host\] SIG|SEH: unhandled|call to unknown target|unimplemented import|divide error' \
            build/logs/runtime.log | tail -n 80 || true
          exit 1

      - name: Upload fast-path logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-fast-logs-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if host build failed
        if: steps.host.outcome != 'success'
        run: |
          echo "Cached translation restored, but the native host build failed. Inspect host-build.log."
          exit 1

      - name: Fail if runtime gate exited early
        if: steps.host.outcome == 'success' && steps.boot.outcome != 'success'
        run: |
          echo "Reflex built successfully but exited before the 30-second runtime gate. Inspect runtime.log and runtime-exit-code.txt."
          exit 1
