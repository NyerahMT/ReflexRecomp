name: Fast Reflex Iteration

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Analyze + Translate Reflex"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "tools/patch_reflex_runtime.py"
      - "tools/patch_reflex_bink.py"
      - "tests/test_bink_framebuffers.py"
      - "tools/analyze_reflex_loading_worker.py"
      - "tools/patch_reflex_d3d9_shaders.py"
      - "tools/patch_reflex_d3d9_swapchain.py"
      - "tools/patch_reflex_d3d9_fvf.py"
      - "runtime/reflex_d3d9_fvf.h"
      - "tools/patch_reflex_d3d9_half.py"
      - "runtime/reflex_d3d9_half.h"
      - "runtime/reflex_frame_rgb.h"
      - "runtime/reflex_d3d9_ffp_quad.h"
      - "tools/patch_reflex_d3d9_ffp_quad.py"
      - "tools/patch_reflex_d3d9_update_texture.py"
      - "tools/patch_reflex_vulkan_a8.py"
      - "tools/patch_reflex_vertex_samplers.py"
      - "tools/patch_reflex_d3d9_misc_inputs.py"
      - "tools/patch_reflex_frame_probe.py"
      - "tools/summarize_reflex_render.py"
      - "tools/patch_reflex_sse.py"
      - "tools/patch_reflex_cached_sse.py"
      - "tools/patch_reflex_cached_simd.py"
      - "tools/patch_reflex_cached_ui_queue.py"
      - "tools/patch_reflex_cached_loading_stages.py"
      - "tools/patch_reflex_cached_first_loader.py"
      - "tools/patch_reflex_cached_ready_poll.py"
      - "tools/patch_reflex_cached_resource_worker.py"
      - "tools/patch_reflex_cached_resource_type1.py"
      - "tools/patch_reflex_cached_type1_body.py"
      - "tools/patch_reflex_cached_type1_gap.py"
      - "tools/patch_reflex_cached_type1_single.py"
      - "tools/patch_reflex_cached_type1_callback.py"
      - "tools/patch_reflex_cached_type1_decoder.py"
      - "tools/patch_reflex_cached_type1_branch.py"
      - "tools/inspect_reflex_loader_asm.py"
      - "tools/patch_reflex_cached_ui_lookup.py"
      - "tools/patch_reflex_cached_ui_boolean.py"
      - "tools/patch_reflex_cached_ui_consumer.py"
      - "tools/patch_reflex_cached_resource_finalize.py"
      - "tools/patch_reflex_cached_resource_gates.py"
      - "tools/patch_reflex_cached_resource_find.py"
      - "tools/audit_translation_traps.py"
      - "tools/scan_reflex_backlog.py"
      - "tools/identify_reflex_unknown_traps.py"
      - "tests/test_identify_reflex_unknown_traps.py"
      - "tests/test_scan_reflex_backlog.py"
      - "tools/check_reflex_boot_progress.py"
      - "tools/profile_reflex_decoder.py"
      - "tools/sample_reflex_native_threads.py"
      - "tools/compare_reflex_decoder_variants.py"
      - "tools/compare_reflex_crt_strings.py"
      - "tools/summarize_reflex_long_load.py"
      - "tools/patch_reflex_interp.py"
      - "tools/refresh_cached_function.py"
      - "tools/patch_reflex_seh.py"
      - "tools/patch_reflex_call_trace.py"
      - ".github/workflows/fast-iterate.yml"

permissions:
  contents: read

concurrency:
  group: fast-reflex-${{ github.ref }}
  cancel-in-progress: true

env:
  KIT_REV: eb32cc42623e0e9e868b9d27423a57d5a5cba56b
  GHIDRA_VERSION: "12.1.3"
  REFLEX_SHA256: 917d14e7ef7ce492b665fea7d0c87c9a39b549e2a43b09883d2a786988e7c02c
  INPUT_REPO: NyerahMT/ReflexBuildInput
  INPUT_TAG: game-input-v1
  CORE_ASSET: Game-Core.zip
  BASELINE_TAG: game-input-v1
  TRANSLATE_POLICY_REV: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build-and-probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: Checkout pinned recomp-kit
        uses: actions/checkout@v7.0.1
        with:
          repository: veritr1x/recomp-kit
          ref: ${{ env.KIT_REV }}
          path: kit

      - name: Patch Reflex runtime compatibility
        run: |
          python3 tools/patch_reflex_seh.py
          python3 tools/patch_reflex_runtime.py
          python3 tools/patch_reflex_d3d9_shaders.py
          python3 tools/patch_reflex_d3d9_swapchain.py
          python3 tools/patch_reflex_d3d9_fvf.py
          python3 tools/patch_reflex_d3d9_half.py
          python3 tools/patch_reflex_frame_probe.py
          python3 tools/patch_reflex_d3d9_ffp_quad.py
          python3 tools/patch_reflex_d3d9_update_texture.py
          python3 tools/patch_reflex_vulkan_a8.py
          python3 tools/patch_reflex_vertex_samplers.py
          python3 tools/patch_reflex_d3d9_misc_inputs.py
          python3 tools/patch_reflex_sse.py
          python3 tools/patch_reflex_interp.py

      - name: Compute private baseline key
        run: |
          set -euo pipefail
          config_sha="$(cat tools/analyze.py game.toml | sha256sum | awk '{print $1}')"
          asset="Reflex-Baseline-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "BASELINE_ASSET=$asset" >> "$GITHUB_ENV"
          # Stable across runtime edits; ccache fingerprints each compilation
          # input independently. Cached guest code stays in a private release.
          warm="Reflex-WarmCCache-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "WARM_CCACHE_ASSET=$warm" >> "$GITHUB_ENV"
          echo "Looking for private baseline: $asset"
          echo "Looking for private warmed compiler cache: $warm"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install fast-path build and runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld build-essential pkg-config unzip ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            xvfb xauth libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt

      - name: Download private Reflex core and recomp baseline
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing Actions secret REFLEX_INPUT_TOKEN"
            exit 1
          fi
          mkdir -p \
            "$RUNNER_TEMP/reflex-assets" \
            "$RUNNER_TEMP/reflex-game" \
            "$RUNNER_TEMP/reflex-baseline"

          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$CORE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber
          test -s "$RUNNER_TEMP/reflex-assets/$CORE_ASSET"
          unzip -q "$RUNNER_TEMP/reflex-assets/$CORE_ASSET" -d "$RUNNER_TEMP/reflex-game"

          # Stage the database/package payload that is not present in Game-Core.zip.
          # Archive.4 currently contains the startup Database assets Reflex reaches
          # after renderer/shader initialization.
          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "Archive.4.zip" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber
          test -s "$RUNNER_TEMP/reflex-assets/Archive.4.zip"
          mkdir -p "$RUNNER_TEMP/reflex-game/Database"
          unzip -q "$RUNNER_TEMP/reflex-assets/Archive.4.zip" \
            -x '__MACOSX/*' \
            -d "$RUNNER_TEMP/reflex-game/Database"

          # The base MXUI database is in Archive.4, but its corresponding
          # MXUI.dx9.package is in private Archive.3. Missing it caused
          # fopen to fail during menu initialization and a nil virtual call
          # at guest return site 0x0080fc3c. Extract exactly this file,
          # not an unrelated substitute; the original stays in the private
          # input repository and is never committed or uploaded as an artifact.
          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "Archive.3.zip" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber
          test -s "$RUNNER_TEMP/reflex-assets/Archive.3.zip"
          unzip -p "$RUNNER_TEMP/reflex-assets/Archive.3.zip" \
            'MXUI.dx9.package' \
            > "$RUNNER_TEMP/reflex-game/Database/MXUI.dx9.package"
          test -s "$RUNNER_TEMP/reflex-game/Database/MXUI.dx9.package"

          # During original-game runs, missing original Music and
          # CrowdSoundProjects packages immediately preceded the
          # null indirect call at 0080fc3c (runs 158 and 159).
          # Preserve the authentic game data: no empty stubs or fake handles.
          # Music was located in private Archive.zip in the previous run.
          for name in Music.dx9.package CrowdSoundProjects.dx9.package; do
            output="$RUNNER_TEMP/reflex-game/Database/$name"
            if [[ ! -s "$output" ]]; then
              for archive in Archive.zip Archive.3.zip Archive.4.zip Archive.2.zip; do
                src="$RUNNER_TEMP/reflex-assets/$archive"
                if [[ ! -s "$src" ]]; then
                  gh release download "$INPUT_TAG" \
                    --repo "$INPUT_REPO" --pattern "$archive" \
                    --dir "$RUNNER_TEMP/reflex-assets" --clobber
                fi
                if python3 tools/stage_reflex_release_asset.py \
                    --archive "$src" --name "$name" --output "$output"; then
                  break
                else
                  status=$?
                  if [[ "$status" -ne 3 ]]; then
                    echo "::error::Private game archive is corrupt or has ambiguous entries for $name"
                    exit "$status"
                  fi
                fi
              done
            fi
            if [[ ! -s "$output" ]]; then
              echo "::error::Original Database/$name missing from all private archives. Supply the original file, not a placeholder."
              exit 1
            fi
          done
          # Inventory ALL original DX9 packages and companion databases in
          # the private input archives, not just the latest crash's filename.
          # Stage missing originals within a bounded disk budget and emit
          # aggregate counts (never private file data or a full asset list).
          for archive in Archive.zip Archive.2.zip Archive.3.zip Archive.4.zip; do
            if [[ ! -s "$RUNNER_TEMP/reflex-assets/$archive" ]]; then
              gh release download "$INPUT_TAG" \
                --repo "$INPUT_REPO" --pattern "$archive" \
                --dir "$RUNNER_TEMP/reflex-assets" --clobber
            fi
          done
          df -h "$RUNNER_TEMP" || true
          python3 tools/audit_reflex_database_assets.py \
            --archive "$RUNNER_TEMP/reflex-assets/Archive.zip" \
            --archive "$RUNNER_TEMP/reflex-assets/Archive.2.zip" \
            --archive "$RUNNER_TEMP/reflex-assets/Archive.3.zip" \
            --archive "$RUNNER_TEMP/reflex-assets/Archive.4.zip" \
            --game-root "$RUNNER_TEMP/reflex-game" \
            --max-stage-bytes 2147483648 \
            --reserve-bytes 4294967296 \
            --stage --report build/logs/reflex-database-asset-inventory.json
          df -h "$RUNNER_TEMP" || true

          # The first confirmed fopen failure immediately before the
          # 0079a627 null vcall is AI/UI_Compound-cb.tdf07 (run 167).
          # Look for the exact original asset in the same private archives.
          # This may be an optional runtime-generated file; absence is a
          # diagnostic, not proof of causation or a reason to synthesize it.
          ai_asset="$RUNNER_TEMP/reflex-game/AI/UI_Compound-cb.tdf07"
          if [[ -s "$ai_asset" ]]; then
            echo "Original AI/UI_Compound-cb.tdf07 already present"
          else
            ai_found=0
            for archive in Archive.zip Archive.2.zip Archive.3.zip Archive.4.zip; do
              if python3 tools/stage_reflex_release_asset.py \
                  --archive "$RUNNER_TEMP/reflex-assets/$archive" \
                  --name "UI_Compound-cb.tdf07" --output "$ai_asset"; then
                ai_found=1
                break
              else
                status=$?
                if [[ "$status" -ne 3 ]]; then
                  echo "::error::Ambiguous or invalid original AI file in $archive"
                  exit "$status"
                fi
              fi
            done
            if [[ "$ai_found" -eq 0 ]]; then
              echo "::notice::AI/UI_Compound-cb.tdf07 not present in available original archives; checking whether this lookup is optional"
            fi
          fi

          # Only extract the referenced originals; clean up the compressed
          # private archives to avoid disk exhaustion during compilation.
          rm -f "$RUNNER_TEMP/reflex-assets/Archive.3.zip" \
                "$RUNNER_TEMP/reflex-assets/Archive.4.zip" \
                "$RUNNER_TEMP/reflex-assets/Archive.2.zip" \
                "$RUNNER_TEMP/reflex-assets/Archive.zip"
          test -s "$RUNNER_TEMP/reflex-game/Database/MXUI.dx9.database"
          test -s "$RUNNER_TEMP/reflex-game/Database/EngineDependencies.dx9.package"
          if [[ ! -s "$RUNNER_TEMP/reflex-game/Database/EngineDependencies.dx9.database" ]]; then
            echo "::warning::Database/EngineDependencies.dx9.database is absent from the current private input archives; runtime will still stop when Reflex opens this companion BXML index."
          fi

          if ! gh release download "$BASELINE_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$BASELINE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-baseline" \
            --clobber; then
            echo "::error::No matching private recomp baseline exists. Run 'Analyze + Translate Reflex' once on this revision/toolchain to create it."
            exit 1
          fi
          test -s "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET"
          tar -xzf "$RUNNER_TEMP/reflex-baseline/$BASELINE_ASSET" -C "$GITHUB_WORKSPACE"
          test -f analysis/decompiled/MXReflex.exe/functions.tsv
          test -f build/recomp/gen/table.c
          test -f build/recomp/gen/symbols.json
          cp build/recomp/gen/symbols.json build/recomp/symbols.json
          test -f build/recomp/symbols.json
          test -d "$CCACHE_DIR"

          # The translation baseline carries only its original compiler cache.
          # Restore more recent, warmed objects from the *private* release.
          mkdir -p "$RUNNER_TEMP/reflex-warm-ccache"
          if gh release download "$BASELINE_TAG" \
              --repo "$INPUT_REPO" \
              --pattern "$WARM_CCACHE_ASSET" \
              --dir "$RUNNER_TEMP/reflex-warm-ccache" \
              --clobber && \
              test -s "$RUNNER_TEMP/reflex-warm-ccache/$WARM_CCACHE_ASSET"; then
            if tar -tzf "$RUNNER_TEMP/reflex-warm-ccache/$WARM_CCACHE_ASSET" \
                >/dev/null; then
              tar -xzf "$RUNNER_TEMP/reflex-warm-ccache/$WARM_CCACHE_ASSET" \
                -C "$GITHUB_WORKSPACE"
              echo "Restored warmed compiler cache from private build input"
            else
              echo "::warning::Private warmed ccache archive is invalid; using original baseline cache"
            fi
          else
            echo "::notice::No warmed compiler cache found yet; a successful build will prime it if REFLEX_INPUT_TOKEN has private-repo write access"
          fi
          ccache --max-size 1G
          ccache --zero-stats

      - name: Locate and verify private executable
        run: |
          set -euo pipefail
          exe="$(find "$RUNNER_TEMP/reflex-game" -type f -iname 'MXReflex.exe' -print -quit)"
          if [[ -z "$exe" ]]; then
            echo "MXReflex.exe was not found after extracting $CORE_ASSET"
            exit 1
          fi
          echo "$REFLEX_SHA256  $exe" | sha256sum -c -
          game_root="$(dirname "$exe")"
          echo "REFLEX_GAME_ROOT=$game_root" >> "$GITHUB_ENV"

      - name: Link private game input
        run: .venv/bin/python tools/setup.py --install "$REFLEX_GAME_ROOT" --link-only

      # The private baseline already contains the current Ghidra recovery and
      # translated game code. Runtime/compatibility edits must not regenerate
      # cached functions: targeted translation changes dependency closure and
      # can regress valid interior-entry/direct-call dispatch.
      - name: Instrument cached runtime frontier
        run: |
          python3 tools/patch_reflex_call_trace.py
          python3 tools/patch_reflex_cached_sse.py
          python3 tools/patch_reflex_cached_simd.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --expect-remaining 0
          python3 tools/patch_reflex_cached_ui_queue.py
          python3 tools/patch_reflex_cached_loading_stages.py
          python3 tools/patch_reflex_cached_first_loader.py
          python3 tools/patch_reflex_cached_ready_poll.py
          python3 tools/patch_reflex_cached_resource_worker.py
          python3 tools/patch_reflex_cached_resource_type1.py
          python3 tools/patch_reflex_cached_type1_body.py
          python3 tools/patch_reflex_cached_type1_gap.py
          python3 tools/patch_reflex_cached_type1_single.py
          python3 tools/patch_reflex_cached_type1_callback.py
          python3 tools/patch_reflex_cached_type1_decoder.py --mode heartbeat
          python3 tools/patch_reflex_cached_type1_branch.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --output build/logs/reflex-callback-branch-target.txt
          python3 tools/patch_reflex_cached_ui_lookup.py
          python3 tools/patch_reflex_cached_ui_boolean.py
          python3 tools/patch_reflex_cached_ui_consumer.py
          python3 tools/patch_reflex_cached_resource_finalize.py
          python3 tools/patch_reflex_cached_resource_gates.py
          python3 tools/patch_reflex_cached_resource_find.py

      # Record *all* still-untranslated opcodes for preventative fixes.
      # This is diagnostic only; an unreachable trap is not a boot failure.
      - name: Inspect original type-1 loader guest instructions
        run: |
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --output build/logs/type1-loader-asm-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x0084beed --end 0x0084bf20 \
            --sites 0084beef,0084bf12 \
            --output build/logs/type1-callback-asm-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x0084ad10 --end 0x0084ad90 \
            --sites 0084ad10,0084beef \
            --output build/logs/type1-callee-asm-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x0084aec9 --end 0x0084aee8 \
            --sites 0084aed4,004f0170 \
            --output build/logs/type1-nested-call-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x004f018f --end 0x004f01bb \
            --sites 004f0199 \
            --output build/logs/type1-decoder-frontier-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x004eefa0 --end 0x004ef025 \
            --sites 004eefa0,004f0199 \
            --output build/logs/type1-inner-decoder-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --generated build/recomp/gen \
            --start 0x004ef3f2 --end 0x004ef445 \
            --sites 004ef3fe,004f019e \
            --output build/logs/type1-decoder-next-opcodes.txt
          # Exact bounded disassembly around the worker-thread null vcall.
          # Only original assembly, no game source or binary in artifact.
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --start 0x00806560 --end 0x008065e0 \
            --output build/logs/post-intro-null-call-asm-window.txt
          # Next audio-worker failure after FMOD EventSystem slot 9 was added.
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --start 0x008067a0 --end 0x00806840 \
            --output build/logs/fmod-next-null-call-asm-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --start 0x0080fbe0 --end 0x0080fc70 \
            --output build/logs/post-fmod-null-call-asm-window.txt
          # At 0079a627 the original game still called a nil target just
          # after the unsupported MSVCR90!atoi import (runtime run 164).
          # Capture only bounded original code windows to distinguish caller
          # object state from a secondary CRT or SEH fault.
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --start 0x0079a5e0 --end 0x0079a660 \
            --output build/logs/post-atoi-null-call-asm-window.txt
          python3 tools/inspect_reflex_loader_asm.py \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --start 0x00797300 --end 0x00797370 \
            --output build/logs/post-atoi-seh-crash-asm-window.txt

      - name: Audit cached translation opcode coverage
        run: |
          python3 tools/audit_translation_traps.py \
            --generated build/recomp/gen \
            --asm analysis/decompiled/MXReflex.exe/functions \
            --output build/logs/translation-trap-audit.txt
      # Inspect only the exact PCs that were not mapped in Ghidra's
      # static listing. Keep instruction bytes and the private PE out of logs.
      - name: Classify remaining unknown guest opcodes
        run: |
          python3 tools/identify_reflex_unknown_traps.py \
            --trap-report build/logs/translation-trap-audit.txt \
            --exe "$REFLEX_GAME_ROOT/MXReflex.exe" \
            --output build/logs/reflex-unknown-instruction-candidates.txt


      - name: Build from cached translation
        id: host
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/logs
          .venv/bin/python tools/build.py --target app \
            2>&1 | tee build/logs/host-build.log
          test -x build/package/ReflexRecomp/ReflexRecomp
          ldd build/package/ReflexRecomp/ReflexRecomp | tee build/logs/host-ldd.txt
          ccache --show-stats | tee build/logs/ccache-after-build.txt

      - name: Preserve warmed compiler cache in private build input
        if: steps.host.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          test -d "$CCACHE_DIR"
          # Save after host compilation even if the guest runtime later fails.
          # Game-derived object files must never appear in public artifacts.
          mkdir -p "$RUNNER_TEMP/reflex-warm-upload"
          archive="$RUNNER_TEMP/reflex-warm-upload/$WARM_CCACHE_ASSET"
          tar -czf "$archive" -C "$GITHUB_WORKSPACE" ".ci-cache/ccache"
          echo "Private compiler cache archive: $(du -h "$archive" | awk '{print $1}')"
          if gh release upload "$BASELINE_TAG" "$archive" \
              --repo "$INPUT_REPO" --clobber; then
            echo "Saved warmed compiler cache to private build input"
          else
            echo "::warning::Could not save warmed compiler cache to private build input. REFLEX_INPUT_TOKEN needs Contents: write permission; future runs will still work with the original baseline cache."
          fi

      - name: Probe Reflex runtime gate
        id: boot
        if: steps.host.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 15s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                REFLEX_FRAME_PROBE=1 \
                REFLEX_FFP_QUAD=1 \
                RECOMP_WATCH_FRAME=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime.log 2>&1
          rc=$?
          set -e
          echo "$rc" > build/logs/runtime-exit-code.txt
          echo "Runtime probe exit code: $rc"
          echo "=== Reflex synchronization trace ==="
          grep -E '\[reflex-sync\]' build/logs/runtime.log | tail -n 240 || true
          echo "=== Runtime frontier tail ==="
          grep -E '\[host\] SIG|SEH: unhandled|call to unknown target|call to 00000000|unimplemented import|divide error|unknown stdcall argument count' \
            build/logs/runtime.log | tail -n 120 || true

          if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then
            if grep -Eq 'unknown stdcall argument count|SEH: unhandled|call to unknown target|call to 00000000' build/logs/runtime.log; then
              echo "FAIL: Reflex stayed alive, but the runtime is stuck behind unresolved ABI/control-flow faults."
              grep -E 'unknown stdcall argument count|SEH: unhandled|call to unknown target|call to 00000000' \
                build/logs/runtime.log | tail -n 80 || true
              exit 1
            fi
            # Survival is not equivalent to startup progress: detect the
            # previously measured Intro/Intro. resource lookup spin.
            # Preserve the classification in the log artifact for review.
            python3 tools/summarize_reflex_render.py build/logs/runtime.log | tee build/logs/render-frontier.txt
            python3 tools/analyze_reflex_loading_worker.py build/logs/runtime.log | tee build/logs/loading-worker-progress.txt
          grep "\[reflex-frame\]" build/logs/runtime.log | tail -n 40 || true
          python3 tools/check_reflex_boot_progress.py build/logs/runtime.log \
              | tee build/logs/runtime-progress.txt
            echo "PASS: Reflex stayed alive for the full 30-second runtime gate without unresolved ABI/control-flow faults."
            exit 0
          fi

          echo "FAIL: Reflex exited before the runtime gate completed."
          grep -E '\[host\] SIG|SEH: unhandled|call to unknown target|unimplemented import|divide error' \
            build/logs/runtime.log | tail -n 80 || true
          exit 1

      # Controlled bisection of the Intro/Intro. vs Intro.ENG key mismatch.
      # The normal runtime gate above remains the baseline. The exact-key
      # comparison workaround only runs in this explicit probe environment.
      - name: Compare exact localized Intro lookup (diagnostic only)
        if: steps.host.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 15s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                RECOMP_WATCH_FRAME=1 \
                REFLEX_PROBE_INTRO_ENGLISH=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime-intro-probe.log 2>&1
          rc=$?
          set -e
          echo "$rc" > build/logs/runtime-intro-probe-exit.txt
          echo "Diagnostic Intro-key probe exit: $rc"
          grep -E '\[reflex-intro-probe\]|\[reflex-ui-boolean\]|\[reflex-ui-result\]|\[reflex-ui-lookup\]|SEH: unhandled|call to unknown target' \
            build/logs/runtime-intro-probe.log | tail -n 60 || true
          python3 tools/check_reflex_boot_progress.py \
            build/logs/runtime-intro-probe.log \
            > build/logs/runtime-intro-probe-progress.txt 2>&1 || true
          cat build/logs/runtime-intro-probe-progress.txt
          echo "=== Early finalizer branch decisions ==="
          grep '\[reflex-resource-gate\]' build/logs/runtime-intro-probe.log | tail -n 20 || true
          echo "=== Resource map find state ==="
          grep '\[reflex-resource-find\]' build/logs/runtime-intro-probe.log | tail -n 20 || true
          echo "=== Resource finalizer virtual-call stages ==="
          grep '\[reflex-finalizer-call\]' build/logs/runtime-intro-probe.log | tail -n 24 || true
          echo "=== Post-Intro resource finalization results ==="
          grep '\[reflex-resource-final\]' build/logs/runtime-intro-probe.log | tail -n 15 || true
          echo "=== Actual translated resource consumer call sites ==="
          grep '\[reflex-ui-consumer\]' build/logs/runtime-intro-probe.log | tail -n 20 || true
          grep "\[reflex-ui-result\]" build/logs/runtime-intro-probe.log | tail -n 15 || true
          exit 0

      # One-off controlled comparison. The merge commit title carries
      # [decoder-profile]; ordinary fast iterations retain the 15s probe.
      # Same executable/runtime environment, only the timeout differs.
      - name: Profile MXTables decoder for 60 seconds
        if: steps.host.outcome == 'success' && github.event_name == 'push' && (contains(github.event.head_commit.message, '[decoder-profile]') || contains(github.event.head_commit.message, '[long-load]'))
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 60s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                REFLEX_FRAME_PROBE=1 \
                REFLEX_FFP_QUAD=1 \
                RECOMP_WATCH_FRAME=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime-profile-60s.log 2>&1
          rc=$?
          set -e
          echo "$rc" > build/logs/runtime-profile-60s-exit.txt
          echo "60-second controlled MXTables run exit=$rc (124=timeout, 137=forced kill)"
          python3 tools/profile_reflex_decoder.py \
            build/logs/runtime.log \
            build/logs/runtime-profile-60s.log \
            --control-seconds 15 --extended-seconds 60 \
            --output build/logs/runtime-decoder-throughput.txt
          # Long-run progress is diagnostic, not a gameplay-boot success claim.
          python3 tools/check_reflex_boot_progress.py \
            build/logs/runtime-profile-60s.log \
            >build/logs/runtime-profile-60s-progress.txt 2>&1 || true
          cat build/logs/runtime-profile-60s-progress.txt
          if grep -Eq 'SEH: unhandled|call to unknown target|call to 00000000|unknown stdcall argument count' \
              build/logs/runtime-profile-60s.log; then
            echo "::warning::Extended decoder run encountered a guest ABI/control-flow fault."
            grep -E 'SEH: unhandled|call to unknown target|call to 00000000|unknown stdcall argument count' \
              build/logs/runtime-profile-60s.log | tail -n 25 || true
          fi

      # A/B Mesa software rasterizer contention without changing the game.
      # [decoder-profile] and [long-load] both trigger the 60-second control above.
      - name: Compare one Mesa worker against default rasterizer
        if: steps.host.outcome == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[mesa-profile]')
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          test -s build/logs/runtime-profile-60s.log || {
            echo "::warning::Missing same-duration default-Mesa control profile."
            exit 1
          }
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 60s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                REFLEX_FRAME_PROBE=1 \
                REFLEX_FFP_QUAD=1 \
                RECOMP_WATCH_FRAME=1 \
                LP_NUM_THREADS=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime-mesa-lp1.log 2>&1
          rc=$?
          set -e
          echo "$rc" >build/logs/runtime-mesa-lp1-exit.txt
          echo "60-second Mesa 1-worker exit: $rc"
          python3 tools/compare_reflex_decoder_variants.py \
            build/logs/runtime-profile-60s.log \
            build/logs/runtime-mesa-lp1.log \
            --seconds 60 --output build/logs/mesa-worker-ab.txt
          grep '\[reflex-frame\] present' build/logs/runtime-mesa-lp1.log \
            | tail -n 4 || true
          python3 tools/check_reflex_boot_progress.py \
            build/logs/runtime-mesa-lp1.log \
            >build/logs/runtime-mesa-lp1-progress.txt 2>&1 || true
          cat build/logs/runtime-mesa-lp1-progress.txt

      # One-time original-vs-optimized guest CRT comparison, using the same
      # Reflex executable and normal 60-second control from [decoder-profile].
      - name: A/B test allocation-free CRT strings against original semantics
        if: steps.host.outcome == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[crt-profile]')
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          test -s build/logs/runtime-profile-60s.log || {
            echo "::error::Missing 60-second reference control"
            exit 1
          }
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 60s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                REFLEX_FRAME_PROBE=1 \
                REFLEX_FFP_QUAD=1 \
                RECOMP_WATCH_FRAME=1 \
                REFLEX_FAST_CRT_STRINGS=1 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime-fast-crt-60s.log 2>&1
          rc=$?
          set -e
          echo "$rc" >build/logs/runtime-fast-crt-60s-exit.txt
          echo "60-second allocation-free guest CRT exit: $rc"
          python3 tools/compare_reflex_crt_strings.py \
            build/logs/runtime-profile-60s.log \
            build/logs/runtime-fast-crt-60s.log \
            --seconds 60 --output build/logs/runtime-fast-crt-ab.txt
          python3 tools/check_reflex_boot_progress.py \
            build/logs/runtime-fast-crt-60s.log \
            >build/logs/runtime-fast-crt-60s-progress.txt 2>&1 || true
          cat build/logs/runtime-fast-crt-60s-progress.txt
          if [[ "$rc" -ne 124 && "$rc" -ne 137 ]]; then
            echo "::error::Optimized CRT guest exited unexpectedly ($rc)"
            exit 1
          fi

      # One-time read-only CPU/wchan observation of real native threads.
      # The game binary, assets and resource readiness are unchanged.
      # Only commits named [thread-profile] trigger this extra 26s run.
      - name: Sample native Reflex scheduler state (one-off)
        if: steps.host.outcome == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[thread-profile]')
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          export app
          set +e
          timeout --signal=TERM --kill-after=5s 42s \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            bash -c '
              env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                  RECOMP_LOG=1 \
                  REFLEX_FRAME_PROBE=1 \
                  REFLEX_FFP_QUAD=1 \
                  RECOMP_WATCH_FRAME=1 \
                  SDL_AUDIODRIVER=dummy \
                  "$app" \
                >build/logs/runtime-native-sampled.log 2>&1 &
              child=$!
              python3 tools/sample_reflex_native_threads.py \
                --pid "$child" --seconds 26 --interval 2 \
                --output build/logs/native-thread-samples.txt
              probe_rc=$?
              kill -TERM "$child" 2>/dev/null || true
              wait "$child" 2>/dev/null || true
              echo "Read-only thread sample exit status: $probe_rc"
            ' >build/logs/native-sampling-driver.log 2>&1
          rc=$?
          echo "$rc" >build/logs/native-sampling-driver-exit.txt
          echo "Native sampling driver exit: $rc"
          cat build/logs/native-sampling-driver.log
          test -s build/logs/native-thread-samples.txt || \
            echo "::warning::No thread sample was captured"
          # This exploratory sampling must never fake a passed guest boot
          # or hide guest ABI failures in the regular 15-second runtime gate.

      # One-shot bounded long startup qualification, not normal fast CI.
      # Never mark the menu playable from process survival alone.
      - name: Qualify original MXTables loading through extended 14-minute run
        if: steps.host.outcome == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[long-load]')
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          test -s build/logs/runtime-profile-60s.log || {
            echo "::error::Missing 60-second decoder control"
            exit 1
          }
          set +e
          # ESI=01ce86ac and [ESI+8] clears before the observed null call.
          # Watch the four-byte guest pointer with the pinned runtime writer trace.
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 840s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                RECOMP_LOG=1 \
                REFLEX_FRAME_PROBE=1 \
                REFLEX_FFP_QUAD=1 \
                RECOMP_WATCH_FRAME=1 \
                RECOMP_WATCH=01ce86b4:4 \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            >build/logs/runtime-long-load.log 2>&1
          rc=$?
          set -e
          echo "$rc" >build/logs/runtime-long-load-exit.txt
          echo "Extended original Reflex startup exit: $rc (124=normal timeout)"
          # Capture the last actual guest writes before the invalid vcall,
          # with native generated-function backtraces when available.
          echo "=== Guest stream object [ESI+8] writer watch ==="
          grep -E 'watch: 01ce86b4 |\[reflex-worker-null\] ret=0080fc3c target=00000000' \
            build/logs/runtime-long-load.log | tail -n 80 || true
          python3 tools/summarize_reflex_long_load.py \
            build/logs/runtime-profile-60s.log \
            build/logs/runtime-long-load.log \
            --seconds 840 --output build/logs/long-load-qualification.txt
          python3 tools/check_reflex_boot_progress.py \
            build/logs/runtime-long-load.log \
            >build/logs/runtime-long-load-progress.txt 2>&1 || true
          cat build/logs/runtime-long-load-progress.txt
          grep '\[reflex-frame\]' build/logs/runtime-long-load.log | tail -n 12 || true
          grep -E 'SEH: unhandled|call to unknown target|unimplemented import' \
            build/logs/runtime-long-load.log | tail -n 25 || true
          # A loader completion must be verified from original guest checkpoints
          # and actual menu rendering; never infer it from a green workflow.

      # Count observed compatibility gaps even after an early native failure.
      # Avoid publishing the private game binary or full disassembly.
      - name: Inventory Reflex compatibility backlog
        if: always()
        run: |
          python3 tools/scan_reflex_backlog.py \
            --trap-report build/logs/translation-trap-audit.txt \
            --runtime build/logs/runtime.log \
            --runtime build/logs/runtime-intro-probe.log \
            --runtime build/logs/runtime-profile-60s.log \
            --runtime build/logs/runtime-long-load.log \
            --json build/logs/reflex-compatibility-backlog.json \
            --markdown build/logs/reflex-compatibility-backlog.md

      - name: Upload fast-path logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-fast-logs-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if host build failed
        if: steps.host.outcome != 'success'
        run: |
          echo "Cached translation restored, but the native host build failed. Inspect host-build.log."
          exit 1

      - name: Fail if runtime gate exited early
        if: steps.host.outcome == 'success' && steps.boot.outcome != 'success'
        run: |
          echo "Reflex built successfully but exited before the 30-second runtime gate. Inspect runtime.log and runtime-exit-code.txt."
          exit 1
