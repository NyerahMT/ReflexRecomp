name: Analyze + Translate Reflex

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KIT_REV: eb32cc42623e0e9e868b9d27423a57d5a5cba56b
  GHIDRA_VERSION: "12.1.3"
  GHIDRA_ARCHIVE: ghidra_12.1.3_PUBLIC_20260817.zip
  GHIDRA_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  REFLEX_SHA256: 917d14e7ef7ce492b665fea7d0c87c9a39b549e2a43b09883d2a786988e7c02c
  INPUT_REPO: NyerahMT/ReflexBuildInput
  INPUT_TAG: game-input-v1
  CORE_ASSET: Game-Core.zip
  BASELINE_TAG: game-input-v1
  TRANSLATE_POLICY_REV: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  analyze-and-translate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ReflexRecomp
        uses: actions/checkout@v7.0.1

      - name: Checkout pinned recomp-kit
        uses: actions/checkout@v7.0.1
        with:
          repository: veritr1x/recomp-kit
          ref: ${{ env.KIT_REV }}
          path: kit

      - name: Patch Reflex SEH continuation
        run: python3 tools/patch_reflex_seh.py

      - name: Compute private baseline key
        run: |
          set -euo pipefail
          config_sha="$(cat tools/analyze.py game.toml | sha256sum | awk '{print $1}')"
          asset="Reflex-Baseline-${REFLEX_SHA256:0:12}-g${GHIDRA_VERSION}-k${KIT_REV:0:12}-c${config_sha:0:12}-p${TRANSLATE_POLICY_REV}.tar.gz"
          echo "BASELINE_ASSET=$asset" >> "$GITHUB_ENV"
          echo "Private baseline asset: $asset"

      - name: Verify private baseline release storage
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing Actions secret REFLEX_INPUT_TOKEN"
            exit 1
          fi

          # Store generated baselines beside the already-private Game-Core asset.
          # This avoids needing permission to create a second release/tag.
          gh release view "$BASELINE_TAG" --repo "$INPUT_REPO" >/dev/null

          probe_name="baseline-write-probe-${GITHUB_RUN_ID}.txt"
          probe_path="$RUNNER_TEMP/$probe_name"
          printf 'ReflexRecomp private baseline write probe\n' > "$probe_path"

          if ! gh release upload "$BASELINE_TAG" "$probe_path" \
            --repo "$INPUT_REPO" \
            --clobber; then
            echo "::error::REFLEX_INPUT_TOKEN can read $INPUT_REPO but cannot upload release assets. Give it Contents: Read and write access to NyerahMT/ReflexBuildInput, then rerun."
            exit 1
          fi

          asset_id="$(
            gh api "repos/$INPUT_REPO/releases/tags/$BASELINE_TAG" \
              --jq ".assets[] | select(.name == \"$probe_name\") | .id" |
            head -n 1
          )"
          if [[ -z "$asset_id" ]]; then
            echo "::error::Private release write probe uploaded but could not be located for cleanup."
            exit 1
          fi
          gh api -X DELETE "repos/$INPUT_REPO/releases/assets/$asset_id"
          echo "Private baseline release storage is writable."

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build and runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld build-essential pkg-config unzip ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            xvfb xauth libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt
          mkdir -p "$CCACHE_DIR"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Download private Reflex core release asset
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reflex-assets" "$RUNNER_TEMP/reflex-game"
          gh release download "$INPUT_TAG" \
            --repo "$INPUT_REPO" \
            --pattern "$CORE_ASSET" \
            --dir "$RUNNER_TEMP/reflex-assets" \
            --clobber
          test -s "$RUNNER_TEMP/reflex-assets/$CORE_ASSET"
          unzip -q "$RUNNER_TEMP/reflex-assets/$CORE_ASSET" -d "$RUNNER_TEMP/reflex-game"

      - name: Locate and verify private executable
        run: |
          set -euo pipefail
          exe="$(find "$RUNNER_TEMP/reflex-game" -type f -iname 'MXReflex.exe' -print -quit)"
          if [[ -z "$exe" ]]; then
            echo "MXReflex.exe was not found after extracting $CORE_ASSET"
            find "$RUNNER_TEMP/reflex-game" -maxdepth 3 -type f | head -n 200
            exit 1
          fi
          echo "$REFLEX_SHA256  $exe" | sha256sum -c -
          game_root="$(dirname "$exe")"
          echo "REFLEX_GAME_ROOT=$game_root" >> "$GITHUB_ENV"
          echo "Reflex install root: $game_root"
          echo "Top-level files:"
          find "$game_root" -maxdepth 1 -type f -printf '%f\n' | sort | head -n 100

      - name: Link private game input
        run: |
          .venv/bin/python tools/setup.py --install "$REFLEX_GAME_ROOT" --link-only

      - name: Download and verify Ghidra 12.1.3
        run: |
          set -euo pipefail
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/$GHIDRA_ARCHIVE"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/$GHIDRA_ARCHIVE" "$url"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/$GHIDRA_ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/$GHIDRA_ARCHIVE" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_HOME="$(find "$RUNNER_TEMP/ghidra" -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -n 1)"
          test -n "$GHIDRA_HOME"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Recover Reflex functions with Ghidra
        run: |
          set -o pipefail
          mkdir -p build/logs
          .venv/bin/python tools/analyze.py --ghidra-home "$GHIDRA_HOME" 2>&1 | tee build/logs/ghidra.log

      - name: Record analysis summary
        run: |
          index="analysis/decompiled/MXReflex.exe/functions.tsv"
          test -f "$index"
          echo "Recovered listing rows: $(wc -l < "$index")"
          head -n 20 "$index" > build/logs/functions-head.txt
          tail -n 20 "$index" > build/logs/functions-tail.txt

      - name: Translate and compile Reflex game code
        id: translate
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python tools/build.py \
            --target gen \
            --regenerate \
            --allow-table-gaps "Reflex Ghidra 12.1.3 recovery leaves six missing block targets in jump table at 0x006a8085 (fn_006a8060); accepted for initial bring-up" \
            --allow-unmodelled "Initial Reflex bring-up: three malformed jump-table recoveries leave 19 literal dispatches without translated entry points; trap only those unresolved paths so the rest of the image can be generated and compiled" \
            2>&1 | tee build/logs/translate.log
          ccache --show-stats | tee build/logs/ccache-after-translate.txt

      - name: Publish private recovery + translation baseline
        if: steps.translate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.REFLEX_INPUT_TOKEN }}
        run: |
          set -euo pipefail
          test -f analysis/decompiled/MXReflex.exe/functions.tsv
          test -f build/recomp/gen/table.c
          test -d "$CCACHE_DIR"

          archive="$RUNNER_TEMP/$BASELINE_ASSET"
          tar -czf "$archive" \
            analysis/decompiled \
            build/recomp/gen \
            .ci-cache/ccache
          test -s "$archive"

          gh release upload "$BASELINE_TAG" "$archive" \
            --repo "$INPUT_REPO" \
            --clobber
          echo "Published private baseline: $BASELINE_ASSET"

      - name: Build Reflex host executable
        id: host
        if: steps.translate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python tools/build.py --target app \
            2>&1 | tee build/logs/host-build.log
          test -x build/package/ReflexRecomp/ReflexRecomp
          ldd build/package/ReflexRecomp/ReflexRecomp | tee build/logs/host-ldd.txt

      - name: Probe first Reflex runtime
        id: boot
        if: steps.host.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          app="$GITHUB_WORKSPACE/build/package/ReflexRecomp/ReflexRecomp"
          test -x "$app"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout --signal=TERM --kill-after=5s 30s \
            env RECOMP_EXE="$REFLEX_GAME_ROOT/MXReflex.exe" \
                SDL_AUDIODRIVER=dummy \
                "$app" \
            2>&1 | tee build/logs/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > build/logs/runtime-exit-code.txt
          echo "First Reflex runtime probe exit code: $rc"
          if [[ "$rc" -eq 124 || "$rc" -eq 137 ]]; then
            echo "Reflex stayed alive for the 30-second probe window."
            exit 0
          fi
          echo "Reflex exited before the probe window completed."
          exit 1

      - name: Upload bring-up logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-bringup-logs-${{ github.run_number }}
          path: |
            build/logs/
            build/recomp/translate-report.json
            analysis/decompiled/inputs.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if translation failed
        if: steps.translate.outcome != 'success'
        run: |
          echo "Ghidra completed, but static translation hit a bring-up failure. Inspect translate.log and translate-report.json."
          exit 1

      - name: Fail if host build failed
        if: steps.translate.outcome == 'success' && steps.host.outcome != 'success'
        run: |
          echo "Reflex translated successfully, but the native host executable did not build. Inspect host-build.log."
          exit 1

      - name: Fail if runtime probe exited early
        if: steps.host.outcome == 'success' && steps.boot.outcome != 'success'
        run: |
          echo "Reflex built successfully but exited before the 30-second runtime gate. Inspect runtime.log and runtime-exit-code.txt."
          exit 1
